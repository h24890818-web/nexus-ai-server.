
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b14;color:#f1f4ff;
 font-family:Tahoma,Arial,sans-serif;height:100dvh;
 display:flex;overflow:hidden
}
.sidebar{
 width:250px;background:#101522;padding:20px;
 border-left:1px solid #252c40;display:flex;
 flex-direction:column
}
.logo{font-size:27px;font-weight:bold;color:#b58aff}
.logo span{color:#fff}
.sub{font-size:11px;color:#888;margin-top:8px}
.new{
 margin-top:35px;padding:14px;border:1px solid #6944a0;
 border-radius:12px;background:#1b1429;color:white;
 cursor:pointer
}
.sidebottom{margin-top:auto;color:#777;font-size:12px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{
 height:70px;border-bottom:1px solid #242535;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 22px
}
.status{color:#62e6a0;font-size:12px}
#chat{
 flex:1;overflow-y:auto;padding:25px;
 display:flex;flex-direction:column;gap:20px
}
.welcome{text-align:center;margin:auto;color:#b8c0d8}
.orb{
 width:100px;height:100px;border-radius:50%;
 margin:0 auto 25px;
 background:radial-gradient(circle,#d2a2ff,#7441bc,#17122b);
 box-shadow:0 0 55px #8544dd88;
 animation:pulse 3s infinite
}
@keyframes pulse{
 50%{box-shadow:0 0 85px #a75bff}
}
.message{
 max-width:750px;padding:16px 19px;
 border-radius:16px;line-height:2;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{
 align-self:flex-start;background:#28213d;
 border:1px solid #59427e
}
.bot{
 align-self:flex-end;background:#141c2d;
 border:1px solid #34435e
}
.sender{font-size:11px;color:#b78bff;margin-bottom:7px}
.composer{
 padding:15px 22px 22px;
 border-top:1px solid #242535;
 background:#0d111d
}
.inputbox{
 max-width:850px;margin:auto;display:flex;gap:10px;
 background:#171e2e;border:1px solid #42415d;
 border-radius:15px;padding:10px
}
textarea{
 flex:1;resize:none;background:transparent;
 border:0;outline:0;color:white;font:14px Tahoma;
 min-height:45px;max-height:130px;padding:12px
}
button{
 border:0;border-radius:11px;padding:12px 18px;
 background:#9b65e9;color:white;font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.5}
.footer{text-align:center;color:#777;font-size:10px;margin-top:12px}
@media(max-width:650px){
 .sidebar{width:65px;padding:10px 5px;align-items:center}
 .logo{font-size:13px}
 .sub,.sidebottom{display:none}
 .new{font-size:0;width:43px;padding:12px 5px;margin-top:25px}
 .new:after{content:"+";font-size:22px}
 header{padding:0 12px}
 #chat{padding:15px 10px}
 .composer{padding:10px}
 .message{max-width:95%}
}
</style>
</head>
<body>

<aside class="sidebar">
 <div class="logo">NEXUS<span> AI</span></div>
 <div class="sub">YOUR INTELLIGENT FUTURE</div>
 <button class="new" onclick="newChat()">＋ گفتگوی جدید</button>
 <div class="sidebottom">NEXUS AI SYSTEM<br>VERSION 2.0</div>
</aside>

<main>
<header>
 <strong>NEXUS AI <span style="color:#ad7aff">/ دستیار هوشمند</span></strong>
 <span class="status">● ONLINE</span>
</header>

<section id="chat">
 <div class="welcome" id="welcome">
  <div class="orb"></div>
  <h2>به NEXUS AI خوش آمدی</h2>
  <p>آینده هوش مصنوعی از اینجا شروع می‌شود.</p>
  <small>هر سوالی داری بپرس...</small>
 </div>
</section>

<div class="composer">
 <div class="inputbox">
  <textarea id="prompt" placeholder="پیامت رو برای NEXUS بنویس..."
  rows="1"></textarea>
  <button id="send" onclick="sendMessage()">ارسال ↑</button>
 </div>
 <div class="footer">POWERED BY NEXUS AI • INTELLIGENCE WITHOUT LIMITS</div>
</div>
</main>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("prompt");
const sendBtn=document.getElementById("send");

let messages=[];

function addMessage(role,text){
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();

 const div=document.createElement("div");
 div.className="message "+(role==="user"?"user":"bot");

 const sender=document.createElement("div");
 sender.className="sender";
 sender.textContent=role==="user"?"YOU":"NEXUS AI";

 const content=document.createElement("div");
 content.textContent=text;

 div.append(sender,content);
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function newChat(){
 messages=[];
 chat.innerHTML=`
 <div class="welcome" id="welcome">
 <div class="orb"></div>
 <h2>گفتگوی جدید آغاز شد</h2>
 <p>من آماده‌ام. چه کاری انجام بدیم؟</p>
 </div>`;
 input.value="";
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text || sendBtn.disabled)return;

 addMessage("user",text);
 messages.push({role:"user",content:text});
 input.value="";
 sendBtn.disabled=true;
 sendBtn.textContent="...";

 const loading=document.createElement("div");
 loading.className="message bot";
 loading.textContent="NEXUS در حال فکر کردن است...";
 chat.appendChild(loading);

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"خطا در ارتباط با سرور");
  }

  if(!data.reply)throw new Error("پاسخی از سرور دریافت نشد");

  loading.remove();
  addMessage("assistant",data.reply);
  messages.push({role:"assistant",content:data.reply});

 }catch(error){
  loading.remove();
  addMessage("assistant","⚠️ خطا در اتصال: "+error.message);
 }finally{
  sendBtn.disabled=false;
  sendBtn.textContent="ارسال ↑";
  input.focus();
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>
</body>
</html>
