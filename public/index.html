
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080910;color:#eee;
 font-family:Tahoma,Arial,sans-serif;
 height:100dvh;display:flex;overflow:hidden
}
.sidebar{
 width:260px;background:#10111b;padding:22px;
 border-left:1px solid #252638;
 display:flex;flex-direction:column
}
.logo{font-size:27px;font-weight:bold;color:#b58aff}
.logo span{color:#fff}
.sub{color:#888;font-size:12px;margin-top:8px}
.new{
 margin-top:35px;padding:14px;border:1px solid #6944a0;
 border-radius:12px;background:#1b1429;color:white;
 cursor:pointer
}
.sidebottom{margin-top:auto;color:#777;font-size:12px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{
 height:70px;border-bottom:1px solid #242535;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 22px
}
.status{font-size:12px;color:#65e6ad}
.status:before{content:"●";margin-left:8px}
#messages{
 flex:1;overflow-y:auto;padding:25px  max(18px,calc((100% - 850px)/2));
 display:flex;flex-direction:column;gap:20px
}
.welcome{text-align:center;margin:auto;color:#aaa}
.orb{
 width:85px;height:85px;border-radius:50%;
 margin:0 auto 22px;display:grid;place-items:center;
 background:radial-gradient(circle,#a86aff,#35165d 65%,#151020);
 box-shadow:0 0 45px #8b43db55;font-size:34px
}
.welcome h1{color:white;font-size:27px}
.welcome p{font-size:14px;line-height:2}
.message{
 max-width:85%;padding:15px 18px;border-radius:17px;
 line-height:2;font-size:14px;white-space:pre-wrap;
 overflow-wrap:anywhere
}
.user{align-self:flex-start;background:#27203a;border:1px solid #51406c}
.ai{align-self:flex-end;background:#151723;border:1px solid #303248}
.composer{
 width:min(850px,95%);margin:12px auto 24px;
 border:1px solid #44405a;background:#141522;
 border-radius:18px;padding:12px;display:flex;gap:10px;
 align-items:flex-end
}
textarea{
 flex:1;background:transparent;color:white;border:0;
 outline:none;resize:none;max-height:130px;
 font:14px Tahoma;line-height:2;padding:8px
}
button{font-family:inherit}
#send{
 background:linear-gradient(135deg,#a35cf4,#6334bc);
 color:white;border:0;border-radius:12px;
 padding:13px 19px;cursor:pointer
}
#send:disabled{opacity:.5}
footer{text-align:center;color:#777;font-size:10px;padding-bottom:12px}
@media(max-width:650px){
 .sidebar{width:65px;padding:12px 7px;align-items:center}
 .logo{font-size:16px}.logo span,.sub,.new span,.sidebottom{display:none}
 .new{margin-top:30px;padding:12px;font-size:20px}
 header{height:60px;padding:0 13px}
 #messages{padding:18px 12px}
 .message{max-width:94%}
 .welcome h1{font-size:23px}
}
</style>
</head>
<body>
<aside class="sidebar">
 <div class="logo">NEXUS<span> AI</span></div>
 <div class="sub">YOUR INTELLIGENT COMPANION</div>
 <button class="new" onclick="clearChat()">＋ <span>گفتگوی جدید</span></button>
 <div class="sidebottom">NEXUS CORE · VERSION 1.0</div>
</aside>

<main>
 <header>
  <strong>NEXUS / هوش مصنوعی</strong>
  <span class="status">ONLINE</span>
 </header>

 <section id="messages">
  <div class="welcome" id="welcome">
   <div class="orb">✦</div>
   <h1>سلام، من NEXUS هستم</h1>
   <p>دستیار هوشمند تو برای فکر کردن، خلق کردن و کشف کردن.<br>امروز چه کاری برات انجام بدم؟</p>
  </div>
 </section>

 <div class="composer">
  <textarea id="input" rows="1" placeholder="پیامت رو برای NEXUS بنویس..."></textarea>
  <button id="send" onclick="sendMessage()">ارسال ↑</button>
 </div>
 <footer>NEXUS AI · POWERED BY OPENROUTER</footer>
</main>

<script>
const messages = [];
const box = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");

function addMessage(text, type) {
 document.getElementById("welcome")?.remove();
 const el = document.createElement("div");
 el.className = "message " + type;
 el.textContent = text;
 box.appendChild(el);
 box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
 const text = input.value.trim();
 if (!text || send.disabled) return;

 input.value = "";
 input.style.height = "auto";
 messages.push({role:"user",content:text});
 addMessage(text,"user");

 send.disabled = true;
 send.textContent = "...";
 const loading = "در حال فکر کردن...";
 addMessage(loading,"ai");
 const loadingEl = box.lastElementChild;

 try {
  const response = await fetch("/api/chat", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });

  const data = await response.json();
  loadingEl.remove();

  if (!response.ok) throw new Error(data.error || "خطا در اتصال");

  const reply = data.reply || "پاسخی دریافت نشد.";
  messages.push({role:"assistant",content:reply});
  addMessage(reply,"ai");

 } catch(error) {
  loadingEl.textContent = "خطا: " + error.message;
 } finally {
  send.disabled = false;
  send.textContent = "ارسال ↑";
  input.focus();
 }
}

function clearChat() {
 messages.length = 0;
 box.innerHTML = `
 <div class="welcome" id="welcome">
 <div class="orb">✦</div>
 <h1>سلام، من NEXUS هستم</h1>
 <p>امروز چه کاری برات انجام بدم؟</p>
 </div>`;
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,130)+"px";
});
</script>
</body>
  </html>
